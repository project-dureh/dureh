id: int-001-provenance
role: interpreter
split: example
prompt: |
  Write reports/interpretation/summary.md interpreting qc.tsv. Cite the run record
  (run.json id), the pipeline revision, and the parameters. Separate observation from
  interpretation and state which subject failed QC. Do not edit qc.tsv or run.json.
required_outputs:
  - reports/interpretation/summary.md
forbidden_writes:
  - qc.tsv
  - run.json
checks:
  - grep -q "run-demo-001" reports/interpretation/summary.md
  - grep -q "sub-02" reports/interpretation/summary.md
  - grep -qi "observ" reports/interpretation/summary.md
