# Legacy roles for startup.yaml schema 1 (release 46 only; removed when schema 1 is refused).
# A schema-1 package names roles in `organization.managers/workers`; release 46 resolves those names against the
# generic roles (org/roles.yaml) plus the roles below, which a schema-2 package declares itself in `roles:`.
# Names a schema-1 package enables that are in neither file (roles removed in release 46) are dropped with a warning.
schema_version: 1
desk:
  may_dispatch: [researcher, doc-writer]
  write_scopes:
    - package/**
    - projects/*/README.md
roles:
  pm-modules:
    kind: manager
    tier: pm
    value: refactor-to-modules
    description: Manager for reusable module work. Splits a bundle into one-worker work items, orders them, integrates results, and returns one Gate 2 bundle.
    may_dispatch: [py-writer, doc-writer, researcher, checker]
    write_scopes: []
  py-writer:
    kind: worker
    tier: worker
    output: Python code and its unit tests for one module.
    never: Verification verdicts, data paths, pipeline execution.
    may_dispatch: []
    write_scopes:
      - modules/*/src/**
      - modules/*/tests/**
      - modules/*/pyproject.toml
      - modules/*/uv.lock
      - modules/*/containers/**
      - modules/*/tools/**
      - projects/*/code/notebooks/**
  doc-writer:
    kind: worker
    tier: worker
    output: Technical and academic documents and package proposals.
    never: Data interpretation, research, code.
    may_dispatch: []
    write_scopes:
      - projects/*/reports/manuscript/**
      - projects/*/code/devnotes/**
      - modules/*/docs/**
      - modules/*/README.md
      - harness/docs/**
      - package/proposals/**
      - package/docs/**
  researcher:
    kind: worker
    tier: worker
    output: A sourced research summary of at most one page, recorded as a finding.
    never: Code or document writes, judgment on behalf of the desk.
    may_dispatch: []
    capabilities: [network]
    write_scopes: []
