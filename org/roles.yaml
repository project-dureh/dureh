# Runtime-neutral organization definition (DUREH harness).
# The harness holds only generic roles, governed upstream (decision D3 as revised 2026-10-08, O10): the desk, a
# generic manager, a generic worker and the checker. A company's own roles live in its startup package (`roles:`
# in startup.yaml schema 2), which adds roles or replaces `manager`/`worker`; the checker can be re-skinned (skill,
# instructions) but keeps `verify` and no write scopes. Runtime adapters (runtimes/) generate their own files from
# the result; generated output is never edited by hand.
#
# Roles are known to the harness only by kind (desk, manager, worker) and by capability, a closed set:
#   submit_jobs  `slurm submit/status/wait/resubmit-failed` and the run events
#   verify       `verify --wi`, verification.recorded, wi.verified
#   network      WebFetch / WebSearch
#
# Write scopes are globs over *logical paths*. A logical path is
#   <target>/<path inside the target>
# where <target> is one of:
#   modules/<name>    a module repository linked or cloned into the site
#   projects/<name>   a site project
#   harness           the DUREH harness repository (via a WI worktree only)
#   package           the startup package repository (via a WI worktree only)
# Writes inside a WI worktree are mapped back to the WI's target first.
# Globs are segment-aware: `*` and `?` match within one path segment and never
# cross `/`; a whole `**` segment matches any depth below (one or more segments
# at the end of a pattern, zero or more in the middle).
schema_version: 2
max_depth: 2
roles:
  desk:
    kind: desk
    tier: desk
    persistent: true
    description: The only persistent agent. Speaks to the Director, owns persona and memory, dispatches, stops, verifies through the checker, and promotes (Gate 2).
    # every manager and every verify role is added at load time; a package adds direct workers through `desk:`
    may_dispatch: [manager, checker]
    capabilities: [submit_jobs, verify, network]
    # The desk writes site organization files directly; records only via tools.
    write_scopes:
      - site:state/persona/**
      - site:state/memory/**
      - site:inbox/**
      - site:notes/**
  manager:
    kind: manager
    tier: pm
    description: Generic manager. Splits a bundle into one-worker work items, orders them, integrates results, and returns one Gate 2 bundle.
    may_dispatch: [worker, checker]
    write_scopes: []
  worker:
    kind: worker
    tier: worker
    output: Code, tests and documentation of one module for one work item.
    never: Verification verdicts, data paths, scheduler jobs.
    may_dispatch: []
    write_scopes:
      - modules/*/src/**
      - modules/*/tests/**
      - modules/*/docs/**
  checker:
    kind: worker
    tier: recount
    output: Measured verification results recorded through the verify tool.
    never: Repairing the artifact it checks, verdict words beyond measured results.
    may_dispatch: []
    capabilities: [verify]
    write_scopes: []
# Event types a role may append through the ledger: its kind's list plus the lists of its capabilities.
# The desk may append any. Lifecycle events are also checked against the WI state machine.
event_authority:
  manager: [guard.denied, finding.created, wi.staged, rework.requested, dispatch.prepared, wi.dispatched, checker.dispatched, agent.started, agent.finished, wi.stopped, bundle.ready, agent.cleaned, lane.refused]
  worker: [guard.denied, finding.created, wi.staged, agent.started, agent.finished, agent.cleaned]
capability_authority:
  submit_jobs: [run.completed, run.status, slurm.via-failed]
  verify: [verification.recorded, wi.verified, rework.requested, run.completed]
  network: []
