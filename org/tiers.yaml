# Capability tiers describe tasks, not vendor products (white paper section 4).
# The site config maps each tier to provider:model plus a qualification record
# or a labeled, time-limited bootstrap waiver. Thresholds here are provisional.
schema_version: 1
tiers:
  recount:
    task: Deterministic recount, schema checks, and re-execution of declared checks.
  worker:
    task: One bounded artifact for one work item.
    bounds:
      max_files: 5
      max_changed_lines: 400
      rework_limit: 2
  writer-academic:
    task: Academic manuscript sections (WI flag academic true).
  pm:
    task: Orchestration of related work items in one bundle.
    bounds:
      max_span: 5
      max_wis_per_bundle: 8
  desk:
    task: Organization-level planning and Director interaction.
  planner:
    task: One plan document for one work item, built from an inventory (phases, ordered items, risks); no code.
  deep:
    task: The hardest reasoning for one work item, chosen per dispatch (`dispatch brief --tier deep`) where a role allows it.
limits:
  worker_brief_bytes: 2048
  manager_brief_bytes: 10240
  worker_report_lines: 30
  # the generated manager instructions: lines a manager returns to the desk, and how often it may re-dispatch an
  # item after failed checks before it stops and reports (guidance in the agent file, not enforced by a hook)
  manager_report_lines: 30
  max_redispatch: 2
  max_concurrent_lanes: 2
  reorg_lanes: 1
  # a dispatch with no agent.started after this many seconds never spawned; a new dispatch supersedes it (release 30)
  dispatch_start_grace_seconds: 120
  # `slurm watch`: a tracked run with no final scheduler state this many days after submission is recorded as
  # stale (UNKNOWN, final) and no longer probed; it holds no lane (release 30)
  watch_stale_days: 7
  reorg_finding_budget: 3
  memory_cap_bytes: 65536
